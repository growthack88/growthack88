    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f766e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0f766e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
