    .eyebrow { font-size: 15px; font-weight: 600; letter-spacing: 3px; fill: #0f766e; }
    .name { font-size: 58px; font-weight: 800; letter-spacing: -1px; fill: #0b1220; }
    .ar { font-size: 30px; font-weight: 600; fill: #4b5868; }
    .tag { font-size: 22px; fill: #4b5868; }
    .chip { font-size: 15px; font-weight: 600; fill: #4b5868; }
    .label { font-size: 12px; font-weight: 600; letter-spacing: 2px; fill: #4b5868; }
    .pulse { transform-box: fill-box; transform-origin: center; opacity: 0; animation: pulse 2.4s ease-out 1s infinite; }
    @keyframes pulse { 0% { opacity: .55; transform: scale(1); } 100% { opacity: 0; transform: scale(3.2); } }
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; }
    }
  </style>

